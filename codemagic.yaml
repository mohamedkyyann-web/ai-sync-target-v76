workflows:
  android-native-workflow:
    name: Android Native Build v76.0
    max_build_duration: 120
    scripts:
      - name: Grant execute permission for gradlew
        script: |
          chmod +x gradlew
      - name: Build Debug APK Package
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
